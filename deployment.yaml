apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafkapractice.api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafkapractice
  template:
    metadata:
      labels:
        app: kafkapractice
    spec:
      containers:
      - name: kafkapractice
        image: kafkapractice.api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080